<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MISTAR RIFAT — Premium Developer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #02020a; }
  canvas { display: block; }

  #loader {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #0a0a1f 0%, #02020a 70%);
    color: #00f0ff;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 10px;
    transition: opacity 1s ease;
  }
  #loader .spinner {
    width: 64px; height: 64px;
    border: 1.5px solid rgba(0, 240, 255, 0.12);
    border-top-color: #00f0ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 28px;
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.5), inset 0 0 20px rgba(0, 240, 255, 0.15);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #hint {
    position: fixed; bottom: 22px; left: 0; width: 100%;
    text-align: center; pointer-events: none; z-index: 5;
    color: rgba(140, 190, 255, 0.32);
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 8px;
    text-transform: uppercase;
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Cinzel:wght@600;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  LOADING
</div>

<div id="hint">Drag to explore · Scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* ═══════════════════════════════════════════════════════════
   1. WAIT FOR FONTS
   ═══════════════════════════════════════════════════════════ */
await Promise.all([
  document.fonts.load('900 200px Orbitron'),
  document.fonts.load('700 200px Orbitron'),
  document.fonts.load('900 200px Cinzel')
]).catch(()=>{});
await document.fonts.ready;

setTimeout(() => {
  const l = document.getElementById('loader');
  l.style.opacity = '0';
  setTimeout(() => l.remove(), 1000);
}, 350);

/* ═══════════════════════════════════════════════════════════
   2. RENDERER / SCENE / CAMERA
   ═══════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02020a);
scene.fog = new THREE.FogExp2(0x02020a, 0.022);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 0.4, 16);

/* ═══════════════════════════════════════════════════════════
   3. POST-PROCESSING (BLOOM)
   ═══════════════════════════════════════════════════════════ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.25,   // strength
  0.75,   // radius
  0.05    // threshold
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ═══════════════════════════════════════════════════════════
   4. ORBIT CONTROLS
   ═══════════════════════════════════════════════════════════ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 9;
controls.maxDistance = 26;
controls.minPolarAngle = Math.PI * 0.30;
controls.maxPolarAngle = Math.PI * 0.70;

/* ═══════════════════════════════════════════════════════════
   5. LIGHTS
   ═══════════════════════════════════════════════════════════ */
scene.add(new THREE.AmbientLight(0x223355, 0.8));

const keyL = new THREE.DirectionalLight(0xffffff, 1.6);
keyL.position.set(6, 9, 7);
scene.add(keyL);

const cyanL = new THREE.PointLight(0x00f0ff, 90, 45);
cyanL.position.set(-9, 3, 6);
scene.add(cyanL);

const pinkL = new THREE.PointLight(0xff2fd0, 70, 45);
pinkL.position.set(9, -3, 6);
scene.add(pinkL);

const goldL = new THREE.PointLight(0xffb648, 45, 50);
goldL.position.set(0, 0, -10);
scene.add(goldL);

/* ═══════════════════════════════════════════════════════════
   6. WORLD GROUP
   ═══════════════════════════════════════════════════════════ */
const world = new THREE.Group();
scene.add(world);

/* ═══════════════════════════════════════════════════════════
   7. STARFIELD (3 depth layers)
   ═══════════════════════════════════════════════════════════ */
function makeStars(count, radiusMin, radiusMax, size, color, opacity) {
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r  = radiusMin + Math.random() * (radiusMax - radiusMin);
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i*3 + 1] = r * Math.sin(ph) * Math.sin(th);
    pos[i*3 + 2] = r * Math.cos(ph);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color, size, sizeAttenuation: true,
    transparent: true, opacity, depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  return new THREE.Points(geo, mat);
}

const starsFar  = makeStars(2200,  60, 160, 0.55, 0x7fb8ff, 0.55);
const starsMid  = makeStars(1200,  30,  70, 0.9,  0xffffff, 0.7);
const starsNear = makeStars(500,   15,  35, 1.4,  0x00f0ff, 0.85);
scene.add(starsFar, starsMid, starsNear);

/* ═══════════════════════════════════════════════════════════
   8. GRID FLOOR
   ═══════════════════════════════════════════════════════════ */
const grid = new THREE.GridHelper(70, 70, 0x00a0d0, 0x0a2a44);
grid.position.y = -6;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

/* ═══════════════════════════════════════════════════════════
   9. TEXT TEXTURE GENERATOR
   ═══════════════════════════════════════════════════════════ */
function makeTextTexture(text, cfg) {
  const {
    fontSize = 300,
    family = 'Orbitron, sans-serif',
    weight = 900,
    letterSpacing = 0,
    colors = ['#00f0ff', '#ffffff', '#00f0ff'],
    glowColor = '#00f0ff',
    glowBlur = 90
  } = cfg;

  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');

  ctx.font = `${weight} ${fontSize}px ${family}`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${letterSpacing}px`;

  const textW = Math.ceil(ctx.measureText(text).width);
  const padX = Math.round(fontSize * 0.45);
  const padY = Math.round(fontSize * 0.45);

  const W = THREE.MathUtils.ceilPowerOfTwo(textW + padX * 2);
  const H = THREE.MathUtils.ceilPowerOfTwo(fontSize * 1.5 + padY * 2);
  c.width = W; c.height = H;

  ctx.font = `${weight} ${fontSize}px ${family}`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${letterSpacing}px`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const grad = ctx.createLinearGradient(0, H/2 - fontSize/2, 0, H/2 + fontSize/2);
  colors.forEach((col, i) => grad.addColorStop(i / (colors.length - 1), col));

  ctx.fillStyle = grad;

  // multi glow passes
  for (let i = 4; i >= 0; i--) {
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = glowBlur * (i * 0.5 + 0.6);
    ctx.fillText(text, W/2, H/2);
  }
  ctx.shadowBlur = 0;
  ctx.fillText(text, W/2, H/2);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true;

  return { texture: tex, aspect: W / H };
}

function createTextMesh(text, cfg) {
  const { texture, aspect } = makeTextTexture(text, cfg);
  const h = cfg.height;
  const w = h * aspect;
  const geo = new THREE.PlaneGeometry(w, h);
  const mat = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    depthWrite: false,
    toneMapped: false,
    side: THREE.DoubleSide,
    blending: THREE.NormalBlending
  });
  return new THREE.Mesh(geo, mat);
}

/* ═══════════════════════════════════════════════════════════
   10. MAIN TITLE  →  MISTAR RIFAT
   ═══════════════════════════════════════════════════════════ */
const titleMesh = createTextMesh('MISTAR RIFAT', {
  fontSize: 320,
  family: 'Orbitron, sans-serif',
  weight: 900,
  letterSpacing: 22,
  colors: ['#00c8ff', '#ffffff', '#00c8ff', '#7a5cff'],
  glowColor: '#00f0ff',
  glowBlur: 100,
  height: 3.0
});
titleMesh.position.set(0, 1.15, 0);
world.add(titleMesh);

/* ═══════════════════════════════════════════════════════════
   11. SEPARATOR LINE (gradient fade at edges)
   ═══════════════════════════════════════════════════════════ */
function makeLineTexture() {
  const c = document.createElement('canvas');
  c.width = 2048; c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 2048, 0);
  g.addColorStop(0.00, 'rgba(0, 240, 255, 0)');
  g.addColorStop(0.20, 'rgba(0, 240, 255, 1)');
  g.addColorStop(0.50, 'rgba(255, 255, 255, 1)');
  g.addColorStop(0.80, 'rgba(0, 240, 255, 1)');
  g.addColorStop(1.00, 'rgba(0, 240, 255, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 24, 2048, 16);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const lineMat = new THREE.MeshBasicMaterial({
  map: makeLineTexture(),
  transparent: true,
  depthWrite: false,
  toneMapped: false,
  blending: THREE.AdditiveBlending
});
const lineMesh = new THREE.Mesh(new THREE.PlaneGeometry(10, 0.16), lineMat);
lineMesh.position.set(0, -0.35, 0);
world.add(lineMesh);

/* ═══════════════════════════════════════════════════════════
   12. SUBTITLE  →  PREMIUM DEVELOPER
   ═══════════════════════════════════════════════════════════ */
const subMesh = createTextMesh('PREMIUM  DEVELOPER', {
  fontSize: 140,
  family: 'Orbitron, sans-serif',
  weight: 500,
  letterSpacing: 42,
  colors: ['#ffd77a', '#ffffff', '#ffb648', '#ffd77a'],
  glowColor: '#ffb648',
  glowBlur: 60,
  height: 0.95
});
subMesh.position.set(0, -1.35, 0);
world.add(subMesh);

/* ═══════════════════════════════════════════════════════════
   13. ROTATING HALO RINGS
   ═══════════════════════════════════════════════════════════ */
function makeRing(radius, tube, color, opacity) {
  const geo = new THREE.TorusGeometry(radius, tube, 8, 260);
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity,
    toneMapped: false, blending: THREE.AdditiveBlending
  });
  return new THREE.Mesh(geo, mat);
}

const ringGroup = new THREE.Group();
world.add(ringGroup);

const ringA = makeRing(5.6, 0.018, 0x00f0ff, 0.9);
ringA.rotation.x = Math.PI / 2;
ringA.rotation.y = 0.15;

const ringB = makeRing(6.4, 0.012, 0x7a5cff, 0.65);
ringB.rotation.x = Math.PI / 2.3;
ringB.rotation.z = 0.4;

const ringC = makeRing(4.8, 0.010, 0xff2fd0, 0.55);
ringC.rotation.x = Math.PI / 1.85;
ringC.rotation.y = -0.3;

const ringD = makeRing(7.4, 0.008, 0xffb648, 0.45);
ringD.rotation.x = Math.PI / 2;
ringD.rotation.z = -0.25;

ringGroup.add(ringA, ringB, ringC, ringD);

/* ═══════════════════════════════════════════════════════════
   14. FLOATING ORBS / PARTICLES AROUND TEXT
   ═══════════════════════════════════════════════════════════ */
const orbGroup = new THREE.Group();
world.add(orbGroup);

const orbColors = [0x00f0ff, 0xff2fd0, 0x7a5cff, 0xffb648, 0x39ff88];
const orbs = [];
for (let i = 0; i < 55; i++) {
  const r = 0.035 + Math.random() * 0.075;
  const geo = new THREE.SphereGeometry(r, 10, 10);
  const color = orbColors[(Math.random() * orbColors.length) | 0];
  const mat = new THREE.MeshBasicMaterial({
    color, toneMapped: false,
    transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending
  });
  const orb = new THREE.Mesh(geo, mat);

  const angle  = Math.random() * Math.PI * 2;
  const radius = 5.5 + Math.random() * 3.5;
  const height = (Math.random() - 0.5) * 8;

  orb.userData = {
    angle, radius, height,
    speed: 0.08 + Math.random() * 0.20,
    bobPhase: Math.random() * Math.PI * 2,
    bobAmp: 0.3 + Math.random() * 0.5
  };

  orbs.push(orb);
  orbGroup.add(orb);
}

/* ═══════════════════════════════════════════════════════════
   15. RESIZE
   ═══════════════════════════════════════════════════════════ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

/* ═══════════════════════════════════════════════════════════
   16. ANIMATION LOOP
   ═══════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
let t = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;

  /* ---- subtle world oscillation ---- */
  world.rotation.y = Math.sin(t * 0.25) * 0.32;
  world.rotation.x = Math.sin(t * 0.18) * 0.035;

  /* ---- title float ---- */
  titleMesh.position.y = 1.15 + Math.sin(t * 1.05) * 0.10;
  subMesh.position.y  = -1.35 + Math.sin(t * 1.05 + 1.4) * 0.07;

  /* ---- line subtle pulse ---- */
  lineMat.opacity = 0.85 + Math.sin(t * 2.2) * 0.15;

  /* ---- rings rotate ---- */
  ringA.rotation.z += dt * 0.25;
  ringB.rotation.z -= dt * 0.18;
  ringC.rotation.z += dt * 0.32;
  ringD.rotation.z -= dt * 0.14;

  /* ---- orb particles orbit ---- */
  for (const orb of orbs) {
    const d = orb.userData;
    d.angle += d.speed * dt;
    orb.position.x = Math.cos(d.angle) * d.radius;
    orb.position.z = Math.sin(d.angle) * d.radius;
    orb.position.y = d.height + Math.sin(t * 0.9 + d.bobPhase) * d.bobAmp;
  }
  orbGroup.rotation.y += dt * 0.08;

  /* ---- starfield slow drift ---- */
  starsFar.rotation.y  -= dt * 0.008;
  starsMid.rotation.y  += dt * 0.014;
  starsNear.rotation.y -= dt * 0.022;

  /* ---- colored light orbit ---- */
  cyanL.position.x = Math.cos(t * 0.55) * 10;
  cyanL.position.z = Math.sin(t * 0.55) * 10;

  pinkL.position.x = Math.cos(t * 0.55 + Math.PI) * 10;
  pinkL.position.z = Math.sin(t * 0.55 + Math.PI) * 10;

  goldL.position.x = Math.cos(t * 0.30) * 7;
  goldL.position.y = Math.sin(t * 0.40) * 4;

  /* ---- bloom subtle breathing ---- */
  bloom.strength = 1.15 + Math.sin(t * 1.6) * 0.15;

  controls.update();
  composer.render();
}

animate();
</script>
</body>
</html>
